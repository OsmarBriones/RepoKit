name: Publish to Thunderstore

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish to Thunderstore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Package Mod
        shell: pwsh
        run: |
          if (Test-Path "external/RepoKit/skills/package-mod/scripts/package-mod.ps1") {
            & external/RepoKit/skills/package-mod/scripts/package-mod.ps1 -ModPath . -Configuration Release
          } else {
            dotnet build -c Release
          }

      - name: Read Package Metadata
        id: pkg_info
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $zip = (Get-ChildItem -Path dist/*.zip | Select-Object -First 1).FullName
          "name=$($manifest.name)" >> $env:GITHUB_OUTPUT
          "version=$($manifest.version_number)" >> $env:GITHUB_OUTPUT
          "file=$zip" >> $env:GITHUB_OUTPUT

      - name: Publish Package to Thunderstore
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          community: repo
          namespace: OsmarBriones
          name: ${{ steps.pkg_info.outputs.name }}
          version: ${{ steps.pkg_info.outputs.version }}
          file: ${{ steps.pkg_info.outputs.file }}
